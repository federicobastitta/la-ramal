name: Controles

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codigo:
    name: Tipos, pruebas y armado
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with: { name: web, path: apps/web/dist, retention-days: 7 }

  reglas:
    name: Reglas de seguridad (emulador)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run test:reglas

  punta-a-punta:
    name: Prueba de punta a punta (demo)
    runs-on: ubuntu-latest
    needs: codigo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build -w @la-ramal/web
      - name: Levantar la app y probar
        run: |
          npm run preview -w @la-ramal/web -- --port 4173 --strictPort &
          npx wait-on -t 60000 http://localhost:4173
          npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: capturas, path: e2e/*.png, retention-days: 7 }
